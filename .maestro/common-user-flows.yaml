appId: com.arinora.rawarr
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "library-tab"
    timeout: 60000

- tapOn:
    id: "library-tab"
- assertVisible:
    id: "library-screen"

# Tracks now open their own screen from the library index rather than
# filtering the list in place, so getting back to the tabs takes a step.
- tapOn:
    id: "library-entry-tracks"
- extendedWaitUntil:
    visible:
      id: "library-collection-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "library-track-item"
    timeout: 60000
- tapOn:
    id: "library-track-item"
- extendedWaitUntil:
    visible:
      id: "playing-bar"
    timeout: 30000
- tapOn:
    id: "detail-back-button"
- assertVisible:
    id: "library-screen"

- tapOn:
    id: "home-tab"
- assertVisible:
    id: "home-screen"

- tapOn:
    id: "search-tab"
- assertVisible:
    id: "search-screen"
- tapOn:
    id: "search-input"
- inputText: "zzzxxyyqvnonexistent"
- extendedWaitUntil:
    visible:
      id: "search-no-results"
    timeout: 30000
- hideKeyboard
- tapOn:
    id: "home-tab"
- assertVisible:
    id: "home-screen"
