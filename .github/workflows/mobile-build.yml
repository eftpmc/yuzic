name: Mobile Build

on:
  workflow_dispatch:

concurrency: mobile-build

jobs:

  build-ios:
    name: Build iOS
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Homebrew Ruby
        run: echo "/opt/homebrew/opt/ruby/bin" >> $GITHUB_PATH

      - name: Install Node dependencies
        run: npm install

      - name: Install Ruby dependencies
        run: |
          gem install bundler
          bundle install

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          cd ios
          pod install

      - name: Run Fastlane iOS build
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios ci_ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/*.ipa


  build-android:
    name: Build Android
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Homebrew Ruby
        run: echo "/opt/homebrew/opt/ruby/bin" >> $GITHUB_PATH

      - name: Install Node dependencies
        run: npm install

      - name: Install Ruby dependencies
        run: |
          gem install bundler
          bundle install

      - name: Decode Android keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Run Fastlane Android build
        env:
          ANDROID_KEYSTORE_PATH: android/app/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android ci_android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/android/*.apk
            build/android/*.aab